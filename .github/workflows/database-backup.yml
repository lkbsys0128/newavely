name: Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1"

permissions:
  contents: read

jobs:
  backup:
    name: Weekly encrypted Supabase backup
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Validate required secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          test -n "$SUPABASE_DB_URL"
          test -n "$BACKUP_GPG_PASSPHRASE"

      - name: Create database dumps
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          BACKUP_DATE="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          BACKUP_DIR="newavely-db-backup-${BACKUP_DATE}"
          mkdir "$BACKUP_DIR"

          pg_dump \
            --dbname "$SUPABASE_DB_URL" \
            --schema-only \
            --no-owner \
            --no-acl \
            --file "$BACKUP_DIR/schema.sql"

          pg_dump \
            --dbname "$SUPABASE_DB_URL" \
            --format custom \
            --compress=9 \
            --no-owner \
            --no-acl \
            --file "$BACKUP_DIR/full.dump"

          test -s "$BACKUP_DIR/schema.sql"
          test -s "$BACKUP_DIR/full.dump"
          pg_restore --list "$BACKUP_DIR/full.dump" > /dev/null

          {
            echo "project=newavely"
            echo "created_at_utc=${BACKUP_DATE}"
            echo "format=pg_dump custom + schema sql"
            echo "client_version=$(pg_dump --version)"
            echo "restore_schema=psql --dbname \"\$DATABASE_URL\" --file schema.sql"
            echo "restore_full=pg_restore --dbname \"\$DATABASE_URL\" --clean --if-exists --no-owner --no-acl full.dump"
          } > "$BACKUP_DIR/manifest.txt"

          tar -czf "${BACKUP_DIR}.tar.gz" "$BACKUP_DIR"
          echo "BACKUP_DIR=$BACKUP_DIR" >> "$GITHUB_ENV"

      - name: Encrypt backup archive
        env:
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --symmetric \
            --cipher-algo AES256 \
            --passphrase "$BACKUP_GPG_PASSPHRASE" \
            --output "${BACKUP_DIR}.tar.gz.gpg" \
            "${BACKUP_DIR}.tar.gz"

          gpg --batch --pinentry-mode loopback \
            --passphrase "$BACKUP_GPG_PASSPHRASE" \
            --decrypt "${BACKUP_DIR}.tar.gz.gpg" \
            | cmp - "${BACKUP_DIR}.tar.gz"

          shred -u "${BACKUP_DIR}.tar.gz"
          rm -rf "$BACKUP_DIR"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_DIR }}-encrypted
          path: ${{ env.BACKUP_DIR }}.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error
